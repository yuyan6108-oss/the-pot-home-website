<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Gallery | The Pot Home</title>
  <style>
    :root {
      --cream: #f9f3e9;
      --brown-dark: #3e2a1a;
      --red: #b8302a;
      --green: #3b7a4e;
      --text: #2e2218;
      --text-muted: #7a6655;
      --border: #ddd0c0;
      --border-light: #ebe0d0;
      --paper: #fdfbf7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans", sans-serif;
      background: var(--cream);
      color: var(--text);
      padding: 40px 20px;
      min-height: 100vh;
    }
    .admin-container {
      max-width: 860px;
      margin: 0 auto;
    }
    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }
    h1 {
      font-family: "Georgia", serif;
      font-size: 1.6rem;
      text-align: left;
    }
    .logout-btn {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 7px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .logout-btn:hover {
      border-color: var(--red);
      color: var(--red);
    }
    .admin-subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 28px;
    }
    .admin-card {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 12px rgba(50,30,15,0.06);
    }
    .card-title {
      font-family: "Georgia", serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--brown-dark);
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-light);
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    .form-group input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
      font-family: inherit;
      background: #fff;
    }
    .form-group input[type="text"]:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(59,122,78,0.1);
    }
    .file-area {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
      background: #fff;
    }
    .file-area:hover { border-color: var(--green); }
    .file-area input[type="file"] { display: none; }
    .file-label { font-size: 0.88rem; color: var(--text-muted); }
    .file-name { font-size: 0.85rem; color: var(--green); font-weight: 600; margin-top: 6px; word-break: break-all; }
    .upload-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }
    .upload-btn:hover { background: #a02020; }
    .upload-btn:disabled { background: var(--text-muted); cursor: not-allowed; }
    .msg {
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-top: 16px;
      display: none;
    }
    .msg.success { display: block; background: rgba(59,122,78,0.1); color: var(--green); border: 1px solid rgba(59,122,78,0.2); }
    .msg.error { display: block; background: rgba(184,48,42,0.1); color: var(--red); border: 1px solid rgba(184,48,42,0.2); }

    /* Gallery list */
    .gallery-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .gallery-item-admin {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      transition: box-shadow 0.2s;
    }
    .gallery-item-admin:hover {
      box-shadow: 0 2px 12px rgba(50,30,15,0.1);
    }
    .gallery-thumb {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--cream);
    }
    .gallery-thumb.video-thumb {
      background: var(--brown-dark);
    }
    .gallery-thumb.video-thumb::after {
      content: "▶";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 1rem;
    }
    .thumb-wrap {
      position: relative;
      width: 64px;
      height: 64px;
      flex-shrink: 0;
      border-radius: 8px;
      overflow: hidden;
    }
    .thumb-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb-play-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      background: rgba(0,0,0,0.45);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .item-info {
      flex: 1;
      min-width: 0;
    }
    .item-title {
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--text);
      margin-bottom: 4px;
    }
    .item-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .item-type-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 4px;
    }
    .item-type-badge.image { background: rgba(59,122,78,0.12); color: var(--green); }
    .item-type-badge.video { background: rgba(184,48,42,0.1); color: var(--red); }
    .item-url {
      font-size: 0.78rem;
      color: var(--text-muted);
      word-break: break-all;
      margin-top: 2px;
    }
    .delete-btn {
      flex-shrink: 0;
      background: none;
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .delete-btn:hover {
      border-color: var(--red);
      color: var(--red);
      background: rgba(184,48,42,0.04);
    }
    .edit-btn {
      flex-shrink: 0;
      background: none;
      border: 1.5px solid var(--green);
      color: var(--green);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .edit-btn:hover {
      background: var(--green);
      color: #fff;
    }
    .item-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .move-actions {
      display: flex;
      gap: 4px;
    }
    .move-btn {
      background: none;
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
      line-height: 1;
    }
    .move-btn:hover:not(:disabled) {
      border-color: var(--green);
      color: var(--green);
      background: rgba(59,122,78,0.06);
    }
    .move-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .edit-title-form {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .edit-title-input {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.88rem;
      font-family: inherit;
      background: #fff;
    }
    .edit-title-input:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(59,122,78,0.12);
    }
    .menu-edit-form {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }
    .menu-edit-form .edit-title-input {
      width: 100%;
      max-width: 200px;
    }
    .edit-save-btn {
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    .edit-save-btn:hover { background: #2d6a3e; }
    .edit-cancel-btn {
      background: none;
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .edit-cancel-btn:hover {
      border-color: var(--text-muted);
    }
    .empty-list {
      text-align: center;
      padding: 32px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .loading-list {
      text-align: center;
      padding: 20px 0;
      color: var(--text-muted);
      font-size: 0.88rem;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .back-link a { color: var(--green); text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }

    /* Menu list */
    .menu-category {
      margin-bottom: 20px;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .menu-category-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--cream), var(--paper));
      border-bottom: 1px solid var(--border);
    }
    .menu-category-cn {
      font-size: 1rem;
      font-weight: 700;
      color: var(--green);
    }
    .menu-category-en {
      font-size: 0.84rem;
      color: var(--text-muted);
    }
    .menu-item-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-light);
      transition: background 0.15s;
    }
    .menu-item-row:last-child {
      border-bottom: none;
    }
    .menu-item-row:hover {
      background: rgba(249, 243, 233, 0.4);
    }
    .menu-item-row:has(.menu-edit-form) {
      flex-wrap: wrap;
      align-items: flex-start;
    }
    .menu-item-index {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--cream);
      border-radius: 50%;
    }
    .menu-item-details {
      flex: 1;
      min-width: 0;
    }
    .menu-item-name-cn {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
    }
    .menu-item-name-en {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-top: 1px;
    }
    .menu-item-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
      margin-top: 2px;
    }
    .menu-item-price {
      flex-shrink: 0;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--red);
    }
    .menu-item-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .add-item-btn {
      display: block;
      width: 100%;
      padding: 10px 16px;
      background: none;
      border: none;
      border-top: 1px dashed var(--border);
      color: var(--green);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
      text-align: center;
    }
    .add-item-btn:hover {
      background: rgba(59,122,78,0.06);
    }
    .add-item-form {
      padding: 14px 16px;
      border-top: 1px dashed var(--border);
      background: rgba(59,122,78,0.03);
    }
    .add-item-form .menu-edit-form {
      gap: 8px;
    }
    .add-item-form .form-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .add-item-form .form-row .edit-title-input {
      flex: 1;
    }
    .add-item-form .form-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 4px;
    }

    @media (max-width: 760px) {
      .admin-container { max-width: 100%; }
      .gallery-item-admin { flex-wrap: wrap; }
      .delete-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <h1>Gallery Admin</h1>
      <button class="logout-btn" id="logout-btn">Logout / 退出</button>
    </div>
    <p class="admin-subtitle">The Pot Home (一锅小筑) — 管理后台</p>

    <!-- Upload form -->
    <div class="admin-card">
      <h2 class="card-title">Upload / 上传</h2>
      <form id="upload-form">
        <div class="form-group">
          <label for="title-input">Title / 标题</label>
          <input type="text" id="title-input" name="title" placeholder="e.g. Hot Pot Chicken" required />
        </div>
        <div class="form-group">
          <label>File / 文件</label>
          <div class="file-area" id="file-area">
            <span class="file-label">点击选择图片或视频</span>
            <div class="file-name" id="file-name"></div>
            <input type="file" id="file-input" name="file" accept="image/*,video/mp4,video/mov,video/webm" required />
          </div>
        </div>
        <button type="submit" class="upload-btn" id="upload-btn">Upload / 上传</button>
      </form>
      <div class="msg" id="msg"></div>
    </div>

    <!-- Gallery list -->
    <div class="admin-card">
      <h2 class="card-title">Uploaded Files / 已上传文件</h2>
      <div id="gallery-list" class="gallery-list">
        <p class="loading-list">Loading... 加载中...</p>
      </div>
    </div>

    <!-- Menu management -->
    <div class="admin-card">
      <h2 class="card-title">Menu Management / 菜单管理</h2>
      <div id="menu-list">
        <p class="loading-list">Loading... 加载中...</p>
      </div>
    </div>

    <p class="back-link"><a href="/">← Back to Homepage / 返回首页</a></p>
  </div>

  <script>
    // === Upload ===
    const form = document.getElementById("upload-form");
    const fileArea = document.getElementById("file-area");
    const fileInput = document.getElementById("file-input");
    const fileName = document.getElementById("file-name");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("upload-btn");

    fileArea.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      fileName.textContent = fileInput.files[0] ? fileInput.files[0].name : "";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "msg";
      msg.textContent = "";
      btn.disabled = true;
      btn.textContent = "Uploading...";

      const fd = new FormData(form);
      try {
        const res = await fetch("/api/gallery/upload", { method: "POST", body: fd });
        const data = await res.json();
        if (res.ok) {
          msg.textContent = "Uploaded! 上传成功";
          msg.className = "msg success";
          form.reset();
          fileName.textContent = "";
          loadGalleryList();
        } else {
          msg.textContent = data.error || "Upload failed.";
          msg.className = "msg error";
        }
      } catch (err) {
        msg.textContent = "Network error.";
        msg.className = "msg error";
      }
      btn.disabled = false;
      btn.textContent = "Upload / 上传";
    });

    // === Gallery list ===
    const listEl = document.getElementById("gallery-list");

    function loadGalleryList() {
      fetch("/api/gallery")
        .then((res) => res.json())
        .then((items) => renderList(items))
        .catch(() => {
          listEl.innerHTML = '<p class="loading-list">Failed to load. 加载失败。</p>';
        });
    }

    function renderList(items) {
      listEl.innerHTML = "";

      if (!items || items.length === 0) {
        listEl.innerHTML = '<p class="empty-list">暂无上传文件 / No files uploaded yet</p>';
        return;
      }

      items.forEach((item) => {
        const row = document.createElement("div");
        row.className = "gallery-item-admin";

        const isVideo = item.type === "video";
        const date = new Date(item.createdAt).toLocaleString("zh-CN");
        const isFirst = items.indexOf(item) === 0;
        const isLast = items.indexOf(item) === items.length - 1;

        row.innerHTML = `
          <div class="thumb-wrap">
            ${isVideo
              ? `<video src="${item.url}" muted preload="metadata"></video>
                 <div class="thumb-play-badge">▶</div>`
              : `<img class="gallery-thumb" src="${item.url}" alt="${escapeHtml(item.title)}" loading="lazy" />`
            }
          </div>
          <div class="item-info">
            <span class="item-type-badge ${item.type}">${isVideo ? "Video" : "Image"}</span>
            <div class="item-title">${escapeHtml(item.title)}</div>
            <div class="item-meta">${date}</div>
            <div class="item-url">${escapeHtml(item.url)}</div>
          </div>
          <div class="item-actions">
            <div class="move-actions">
              <button class="move-btn move-up" data-id="${item.id}" ${isFirst ? "disabled" : ""}>↑</button>
              <button class="move-btn move-down" data-id="${item.id}" ${isLast ? "disabled" : ""}>↓</button>
            </div>
            <button class="edit-btn" data-id="${item.id}" data-current-title="${escapeHtml(item.title)}">Edit / 编辑</button>
            <button class="delete-btn" data-id="${item.id}">Delete / 删除</button>
          </div>
        `;

        row.querySelector(".delete-btn").addEventListener("click", () => deleteItem(item.id));
        row.querySelector(".edit-btn").addEventListener("click", () => startEdit(item.id, item.title, row));
        const moveUpBtn = row.querySelector(".move-up");
        const moveDownBtn = row.querySelector(".move-down");
        moveUpBtn.addEventListener("click", () => moveItem(item.id, "up"));
        moveDownBtn.addEventListener("click", () => moveItem(item.id, "down"));
        listEl.appendChild(row);
      });
    }

    function deleteItem(id) {
      if (!confirm("确定要删除这个文件吗？/ Are you sure you want to delete this file?")) return;

      fetch(`/api/gallery/${id}`, { method: "DELETE" })
        .then((res) => res.json())
        .then((data) => {
          if (data.ok) {
            loadGalleryList();
          } else {
            alert(data.error || "Delete failed.");
          }
        })
        .catch((err) => {
          alert("Network error.");
        });
    }

    function moveItem(id, direction) {
      fetch(`/api/gallery/${id}/move`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ direction })
      })
        .then((res) => res.json())
        .then((data) => {
          if (data.ok) {
            loadGalleryList();
          } else {
            alert(data.error || "Move failed.");
          }
        })
        .catch(() => alert("Network error."));
    }

    function editItem(id, newTitle, row) {
      fetch(`/api/gallery/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: newTitle })
      })
        .then((res) => res.json())
        .then((data) => {
          if (data.error) {
            alert(data.error || "Edit failed.");
          } else {
            loadGalleryList();
          }
        })
        .catch(() => alert("Network error."));
    }

    function startEdit(id, currentTitle, row) {
      const infoEl = row.querySelector(".item-info");
      const titleEl = infoEl.querySelector(".item-title");
      const original = titleEl.textContent;

      titleEl.innerHTML = `
        <div class="edit-title-form">
          <input class="edit-title-input" type="text" value="${escapeHtml(currentTitle)}" />
          <button class="edit-save-btn">Save / 保存</button>
          <button class="edit-cancel-btn">Cancel / 取消</button>
        </div>`;

      const input = titleEl.querySelector(".edit-title-input");
      input.focus();
      input.select();

      function cancelEdit() {
        titleEl.innerHTML = escapeHtml(original);
      }

      titleEl.querySelector(".edit-save-btn").addEventListener("click", () => {
        const val = input.value.trim();
        if (!val) {
          input.style.borderColor = "var(--red)";
          return;
        }
        editItem(id, val, row);
      });

      titleEl.querySelector(".edit-cancel-btn").addEventListener("click", cancelEdit);

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const val = input.value.trim();
          if (val) editItem(id, val, row);
        }
        if (e.key === "Escape") cancelEdit();
      });
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    // === Logout ===
    document.getElementById("logout-btn").addEventListener("click", () => {
      if (!confirm("确定退出登录？/ Confirm logout?")) return;
      fetch("/api/admin/logout", { method: "DELETE" }).then(() => {
        window.location.reload();
      });
    });

    // === Menu list ===
    const menuListEl = document.getElementById("menu-list");

    function loadMenuList() {
      fetch("/api/admin/menu")
        .then((res) => res.json())
        .then((categories) => renderMenuList(categories))
        .catch(() => {
          menuListEl.innerHTML = '<p class="loading-list">Failed to load. 加载失败。</p>';
        });
    }

    function renderMenuList(categories) {
      menuListEl.innerHTML = "";

      if (!categories || categories.length === 0) {
        menuListEl.innerHTML = '<p class="empty-list">暂无菜单 / No menu data</p>';
        return;
      }

      categories.forEach((cat) => {
        const catDiv = document.createElement("div");
        catDiv.className = "menu-category";

        catDiv.innerHTML = `
          <div class="menu-category-header">
            <span class="menu-category-cn">${escapeHtml(cat.category_cn || "")}</span>
            <span class="menu-category-en">${escapeHtml(cat.category || "")}</span>
          </div>
        `;

        if (cat.items && cat.items.length > 0) {
          cat.items.forEach((item, idx) => {
            const row = document.createElement("div");
            row.className = "menu-item-row";

            const catIndex = categories.indexOf(cat);

            row.innerHTML = `
              <span class="menu-item-index">${idx + 1}</span>
              <div class="menu-item-details">
                <div class="menu-item-name-cn">${escapeHtml(item.name_cn || "")}</div>
                <div class="menu-item-name-en">${escapeHtml(item.name || "")}</div>
                ${item.description ? `<div class="menu-item-desc">${escapeHtml(item.description)}</div>` : ""}
              </div>
              <span class="menu-item-price">${escapeHtml(item.price || "")}</span>
              <div class="menu-item-actions">
                <button class="edit-btn menu-edit-btn" data-cat="${catIndex}" data-item="${idx}">Edit / 编辑</button>
                <button class="delete-btn menu-delete-btn" data-cat="${catIndex}" data-item="${idx}">Delete / 删除</button>
              </div>
            `;

            row.querySelector(".menu-edit-btn").addEventListener("click", () => startMenuEdit(row, catIndex, idx, item));
            row.querySelector(".menu-delete-btn").addEventListener("click", () => deleteMenuItem(catIndex, idx));

            catDiv.appendChild(row);
          });

          const addBtn = document.createElement("button");
          addBtn.className = "add-item-btn";
          addBtn.textContent = "+ Add Item / 添加菜品";
          const catIndexAdd = categories.indexOf(cat);
          addBtn.addEventListener("click", () => startAddItem(catIndexAdd, catDiv));
          catDiv.appendChild(addBtn);
        } else {
          const emptyRow = document.createElement("div");
          emptyRow.style.cssText = "padding: 12px 16px; color: var(--text-muted); font-size: 0.88rem; text-align: center;";
          emptyRow.textContent = "No items / 暂无菜品";
          catDiv.appendChild(emptyRow);
        }

        menuListEl.appendChild(catDiv);
      });
    }

    function startMenuEdit(row, catIndex, itemIndex, item) {
      const details = row.querySelector(".menu-item-details");
      const actions = row.querySelector(".menu-item-actions");
      const priceEl = row.querySelector(".menu-item-price");

      details.innerHTML = `
        <div class="menu-edit-form">
          <input class="edit-title-input" type="text" placeholder="中文名" value="${escapeHtml(item.name_cn || "")}" data-field="name_cn" />
          <input class="edit-title-input" type="text" placeholder="English" value="${escapeHtml(item.name || "")}" data-field="name" />
          <input class="edit-title-input" type="text" placeholder="描述 / Description" value="${escapeHtml(item.description || "")}" data-field="description" />
          <input class="edit-title-input" type="text" placeholder="价格 / Price" value="${escapeHtml(item.price || "")}" data-field="price" />
        </div>`;

      priceEl.style.display = "none";
      actions.innerHTML = `
        <button class="edit-save-btn menu-save-btn">Save / 保存</button>
        <button class="edit-cancel-btn menu-cancel-btn">Cancel / 取消</button>
      `;

      actions.querySelector(".menu-save-btn").addEventListener("click", () => {
        const inputs = details.querySelectorAll(".edit-title-input");
        const updated = {};
        inputs.forEach((inp) => {
          updated[inp.dataset.field] = inp.value.trim();
        });

        fetch("/api/admin/menu/item", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ categoryIndex: catIndex, itemIndex, ...updated })
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.error) {
              alert(data.error || "Edit failed.");
            } else {
              loadMenuList();
            }
          })
          .catch(() => alert("Network error."));
      });

      actions.querySelector(".menu-cancel-btn").addEventListener("click", () => {
        loadMenuList();
      });
    }

    function deleteMenuItem(catIndex, itemIndex) {
      if (!confirm("确定要删除这个菜品吗？/ Are you sure you want to delete this item?")) return;

      fetch("/api/admin/menu/item", {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ categoryIndex, itemIndex })
      })
        .then((res) => res.json())
        .then((data) => {
          if (data.ok) {
            loadMenuList();
          } else {
            alert(data.error || "Delete failed.");
          }
        })
        .catch(() => alert("Network error."));
    }

    function startAddItem(catIndex, catDiv) {
      const existingBtn = catDiv.querySelector(".add-item-btn");
      if (existingBtn) existingBtn.style.display = "none";

      const existingForm = catDiv.querySelector(".add-item-form");
      if (existingForm) existingForm.remove();

      const form = document.createElement("div");
      form.className = "add-item-form";
      form.innerHTML = `
        <div class="menu-edit-form">
          <input class="edit-title-input" type="text" placeholder="中文名" data-field="name_cn" />
          <input class="edit-title-input" type="text" placeholder="English name" data-field="name" />
          <input class="edit-title-input" type="text" placeholder="描述 / Description" data-field="description" />
          <input class="edit-title-input" type="text" placeholder="价格 / Price" data-field="price" />
          <div class="form-actions">
            <button class="edit-save-btn add-save-btn">Save / 保存</button>
            <button class="edit-cancel-btn add-cancel-btn">Cancel / 取消</button>
          </div>
        </div>`;

      catDiv.insertBefore(form, catDiv.querySelector(".add-item-btn") || null);
      form.querySelector(".edit-title-input").focus();

      form.querySelector(".add-save-btn").addEventListener("click", () => {
        const inputs = form.querySelectorAll(".edit-title-input");
        const newItem = {};
        inputs.forEach((inp) => {
          newItem[inp.dataset.field] = inp.value.trim();
        });

        if (!newItem.name && !newItem.name_cn) {
          alert("Please enter at least one of name or name_cn.");
          return;
        }

        fetch("/api/admin/menu/item", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ categoryIndex: catIndex, item: newItem })
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.error) {
              alert(data.error || "Failed to add item.");
            } else {
              loadMenuList();
            }
          })
          .catch(() => alert("Network error."));
      });

      form.querySelector(".add-cancel-btn").addEventListener("click", () => {
        loadMenuList();
      });
    }

    // Load list on page load
    loadGalleryList();
    loadMenuList();
  </script>
</body>
</html>
